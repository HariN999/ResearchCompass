name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hf.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Clean Backend Repository
        run: |
          mkdir -p ../hf_deploy
          # Sync only backend files, excluding caches and environments
          rsync -av --exclude="venv" --exclude="__pycache__" --exclude="chroma" --exclude=".pytest_cache" --exclude=".env" backend/ ../hf_deploy/
          # Copy .dockerignore if it exists
          cp backend/.dockerignore ../hf_deploy/ 2>/dev/null || true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is empty or missing! Please make sure it is added under Repository Secrets (not Environment Secrets) in your GitHub repo settings."
            exit 1
          fi
          cd ../hf_deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: sync backend from github action"
          # Push to HF Space using the secret token
          git push -f https://HariN999:$HF_TOKEN@huggingface.co/spaces/HariN999/ResearchCompass main
